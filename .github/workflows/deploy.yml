name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/opt/career-case-management"
            APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            mkdir -p "$APP_DIR"

            cat > "$APP_DIR/docker-compose.prod.yml" <<'COMPOSE_EOF'
            services:
              app:
                image: ${APP_IMAGE}
                container_name: career-case-app
                restart: unless-stopped
                ports:
                  - "3000:3000"
                environment:
                  MONGODB_URI: ${MONGODB_URI}
                  NODE_ENV: production
            COMPOSE_EOF

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            export APP_IMAGE="$APP_IMAGE"
            export MONGODB_URI="${{ secrets.MONGODB_URI }}"

            docker compose -f "$APP_DIR/docker-compose.prod.yml" pull
            docker compose -f "$APP_DIR/docker-compose.prod.yml" up -d --remove-orphans
            docker image prune -f

            docker compose -f "$APP_DIR/docker-compose.prod.yml" ps
